# Generated with the help of Gemini.
name: Database Module Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Database/**'
      - 'constants.py'
      - 'dataRecords.py'
      - '.github/workflows/database-tests.yml'
      - 'requirements.txt'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Database/**'
      - 'constants.py'
      - 'dataRecords.py'
      - '.github/workflows/database-tests.yml'
      - 'requirements.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Database Schema Unit Tests
      run: |
        python -m unittest Database.databaseUnitTests -v

    - name: Run Database Interaction Unit Tests
      run: |
        python -m Database.databaseInteractUnitTests -v
