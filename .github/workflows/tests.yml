# Generated with the help of Gemini.
name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run Database Schema Unit Tests
        run: |
          python -m unittest Database.databaseUnitTests -v

      - name: Run Database Interaction Unit Tests
        run: |
          python -m Database.databaseInteractUnitTests -v
