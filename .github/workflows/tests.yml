# Generated with the help of Gemini.
name: Run Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Regression Tests
      - name: Run Database Schema Regression Tests
        run: |
          python -m unittest regression_tests.databaseRegressionTests -v

      - name: Run Database Interaction Regression Tests
        run: |
          python -m unittest regression_tests.databaseInteractRegressionTests -v

      - name: Run Update Tree Stat Regression Tests
        run: |
          python -m unittest regression_tests.databaseStatUpdateRegressionTests -v

      - name: Run API Questions Regression Tests
        run: |
          python -m unittest regression_tests.apiQuestionsRegressionTests -v

      - name: Run API User Regression Tests
        run: |
          python -m unittest regression_tests.apiUserRegressionTests -v

      - name: Run API Stat Update Regression Tests
        run: |
          python -m unittest regression_tests.apiStatRegressionTests -v

      # API Unit Tests
      - name: Run Auth Router Unit Tests
        run: |
          python -m unittest api.__test__.authUnitTest -v

      - name: Run Questions Router Unit Tests
        run: |
          python -m unittest api.__test__.questionsUnitTest -v

      - name: Run Stats Router Unit Tests
        run: |
          python -m unittest api.__test__.statsUnitTest -v

      - name: Run Users Router Unit Tests
        run: |
          python -m unittest api.__test__.usersUnitTest -v

      - name: Run Dependencies Unit Tests
        run: |
          python -m unittest api.__test__.dependenciesUnitTest -v

      # Service Unit Tests
      - name: Run Auth Service Unit Tests
        run: |
          python -m unittest services.__test__.authServiceUnitTest -v

      - name: Run Question Service Unit Tests
        run: |
          python -m unittest services.__test__.questionServiceUnitTest -v

      - name: Run Tree Service Unit Tests
        run: |
          python -m unittest services.__test__.treeServiceUnitTest -v

      - name: Run Decay Service Unit Tests
        run: |
          python -m unittest services.__test__.decayServiceUnitTest -v

      # Integration Tests
      - name: Run Backend Integration Tests
        run: |
          python -m unittest integration_tests.serverIntegrationTests -v

      - name: Run API Integration Tests
        run: |
          python -m unittest integration_tests.apiIntegrationTest -v



  fullstack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Run Full-Stack Question Quest Tests
        run: python -m unittest fullstack_tests.fullStackQuestionQuestTests -v

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm run test
