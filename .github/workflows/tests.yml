# Generated with the help of Gemini.
name: Run Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Schema Unit Tests
        run: |
          python -m unittest tests.databaseUnitTests -v

      - name: Run Database Interaction Unit Tests
        run: |
          python -m unittest tests.databaseInteractUnitTests -v

      - name: Run Update Tree Stat Tests
        run: |
          python -m unittest tests.databaseStatUpdateUnitTests -v

      - name: Run API Questions Tests
        run: |
          python -m unittest tests.apiQuestionsUnitTests -v

      - name: Run API User Tests
        run: |
          python -m unittest tests.apiUserUnitTests -v

      - name: Run API Stat Update Tests
        run: |
          python -m unittest tests.apiStatUnitTests -v

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm run test